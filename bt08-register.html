<h2 align="center">ĐĂNG KÝ THAM GIA DIỄN ĐÀN</h2>

<form action="#">

<table border="1" align="center" bgcolor="lightpink" cellspacing="0" cellpadding="5">

<tr>
    <td>Tên đăng nhập:</td>
    <td>
        <input type="text" name="username"
        placeholder="Nhập tên đăng nhập" required>
    </td>
</tr>

<tr>
    <td>Mật khẩu:</td>
    <td>
        <input type="password" name="password" required>
    </td>
</tr>

<tr>
    <td>Giới tính:</td>
    <td>
        <input type="radio" name="gt" value="Nam"> Nam
        <input type="radio" name="gt" value="Nu"> Nữ
    </td>
</tr>

<tr>
    <td>Ngày sinh:</td>
    <td>
        <input type="date" required>
    </td>
</tr>

<tr>
    <td>Email:</td>
    <td>
        <input type="email" name="email" required>
    </td>
</tr>

<tr>
    <td>Ngôn ngữ lập trình yêu thích nhất</td>
    <td>
        <select required>
            <option value=""></option>
            <option>C++</option>
            <option>C#</option>
            <option>PHP</option>
            <option>Java</option>
            <option>Python</option>
        </select>
    </td>
</tr>

<tr>
    <td>Quy định khi tham gia diễn đàn</td>
    <td>
        <textarea rows="4" cols="30" readonly>
Bài viết phải nghiêm túc, không chứa quảng cáo, không có nội dung phản cảm.
        </textarea>
    </td>
</tr>

<tr>
    <td>
    </td>
    <td>
        <button type="submit">Đăng ký</button>
        <button type="reset">Hủy</button>
    </td>
</tr>

</table>

</form>

</td>
