<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 04</title>
    <style>
        table{
            width:80%;
            margin:auto;
            border-collapse:collapse;
        }

        th, td{
            border:1px solid black;
            padding:8px;
        }

        h2{
            text-align:center;
        }

        th{
            background:lightgray;
        }

        .dat{
            background:yellow;
            color:black;
            font-weight:bold;
            text-align:center;
        }

        .khongdat{
            background:red;
            color:white;
            font-weight:bold;
            text-align:center;
        }

        tfoot{
            background:white;
            font-weight:bold;
        }
    </style>
</head>
   
<body>

<h2>KẾT QUẢ HỌC TẬP</h2>

<table>

    <thead>
        <tr>
            <th rowspan="2">Họ tên</th>
            <th colspan="3">Môn học</th>
            <th rowspan="2">Kết quả</th>
        </tr>

        <tr>
            <th>Toán</th>
            <th>Văn</th>
            <th>Ngoại ngữ</th>
        </tr>
    </thead>

    <tbody>
        <tr>
            <td>Trần Văn Thanh</td>
            <td align="center">8</td>
            <td align="center">5</td>
            <td align="center">7</td>
            <td class="dat">Đạt</td>
        </tr>

        <tr>
            <td>Lê Thanh Sơn</td>
            <td align="center">4</td>
            <td align="center">9</td>
            <td align="center">6</td>
            <td class="khongdat">Không đạt</td>
        </tr>

        <tr>
            <td>Nguyễn Thị Tuyết</td>
            <td align="center">8</td>
            <td align="center">9</td>
            <td align="center">5</td>
            <td class="dat">Đạt</td>
        </tr>
    </tbody>

    <tfoot>
        <tr>
            <td colspan="4">Tổng số học sinh đạt</td>
            <td align="center">2</td>
        </tr>
    </tfoot>

</table>
</body>
</html>
